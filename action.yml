name: Before You Contribute
description: Audit contribution policy and issue availability before work starts.
author: SirHegel

branding:
  icon: search
  color: blue

inputs:
  repository:
    description: Repository in OWNER/REPO format.
    required: false
    default: ${{ github.repository }}
  issue:
    description: Optional issue number to check for existing work.
    required: false
    default: ''
  format:
    description: Output format, either text or json.
    required: false
    default: text
  strict:
    description: Fail when contributions are forbidden or the issue is taken.
    required: false
    default: 'false'

outputs:
  verdict:
    description: Combined audit verdict (READY, REVIEW, or BLOCKED).
    value: ${{ steps.audit.outputs.verdict }}
  policy_verdict:
    description: Contribution-policy verdict.
    value: ${{ steps.audit.outputs.policy_verdict }}
  issue_verdict:
    description: Issue-availability verdict, or SKIPPED when no issue was requested.
    value: ${{ steps.audit.outputs.issue_verdict }}

runs:
  using: composite
  steps:
    - name: Audit before contributing
      id: audit
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BYC_REPOSITORY: ${{ inputs.repository }}
        BYC_ISSUE: ${{ inputs.issue }}
        BYC_FORMAT: ${{ inputs.format }}
        BYC_STRICT: ${{ inputs.strict }}
      run: |
        "${{ github.action_path }}/bin/action-entrypoint" "${{ github.action_path }}"
