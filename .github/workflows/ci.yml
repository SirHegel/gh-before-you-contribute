name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint shell scripts
        run: >-
          shellcheck gh-before-you-contribute bin/* tests/run.sh
          tests/fixtures/bin/* tests/fixtures/action/*

      - name: Install schema test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/schema-venv"
          "$RUNNER_TEMP/schema-venv/bin/pip" install --disable-pip-version-check --no-input -r requirements-dev.txt

      - name: Run deterministic tests
        env:
          SCHEMA_PYTHON: ${{ runner.temp }}/schema-venv/bin/python
        run: tests/run.sh

      - name: Exercise the composite Action on the hosted runner
        id: action-smoke
        uses: ./
        with:
          repository: SirHegel/gh-before-you-contribute
          format: json

      - name: Verify native Action outputs
        env:
          VERDICT: ${{ steps.action-smoke.outputs.verdict }}
          POLICY_VERDICT: ${{ steps.action-smoke.outputs.policy_verdict }}
          ISSUE_VERDICT: ${{ steps.action-smoke.outputs.issue_verdict }}
        run: |
          if [[ "$VERDICT" != "READY" \
            || "$POLICY_VERDICT" != "DISCLOSE" \
            || "$ISSUE_VERDICT" != "SKIPPED" ]]; then
            printf 'Unexpected Action outputs: verdict=%s policy=%s issue=%s\n' \
              "$VERDICT" "$POLICY_VERDICT" "$ISSUE_VERDICT" >&2
            exit 1
          fi
